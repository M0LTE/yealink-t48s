#!KAMAILIO
# SPDX-License-Identifier: AGPL-3.0-or-later
# Throwaway registrar and proxy for sip/test/call-test.sh: loopback only,
# digest login for REGISTER and INVITE, registrations kept in memory. A UDP
# client whose source port is not the one it gave (sip/test/nat.py's NAT,
# for sip/test/nat-test.sh) is reached at its source, as behind a router.
# Test passwords only; nothing here is a real credential.
#
# Variants for sip/test/interop-test.sh (issue #77), chosen with -A:
#   NO_RR       a transparent proxy: no Record-Route, so requests inside a
#               call go straight between the phones
#   WITH_TOPOS  topology hiding (topos): the proxy rewrites Via, Contact and
#               Record-Route as a B2BUA would, so each side only sees it
#   WITH_SST    session timers (sst): the proxy puts Session-Expires: 90 in
#               every INVITE without one and ends a call whose session is not
#               refreshed in time, with a BYE to both sides
#   UAC_TRUSTED requests from user uac (sip/test/uac.py) need no password

debug=2
log_stderror=yes
memdbg=5
memlog=5
children=2
listen=udp:127.0.0.1:5060
listen=tcp:127.0.0.1:5060
auto_aliases=no

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "auth.so"
loadmodule "ctl.so"
loadmodule "nathelper.so"
#!ifdef WITH_TOPOS
loadmodule "htable.so"
loadmodule "topos_htable.so"
loadmodule "topos.so"
modparam("topos", "storage", "htable")
#!endif
#!ifdef WITH_SST
loadmodule "dialog.so"
loadmodule "sst.so"
modparam("dialog", "timeout_avp", "$avp(dlg_timeout)")
modparam("dialog", "send_bye", 1)
modparam("sst", "timeout_avp", "$avp(dlg_timeout)")
modparam("sst", "sst_flag", 6)
modparam("sst", "min_se", 90)
#!endif

modparam("usrloc", "db_mode", 0)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("ctl", "binrpc", "unix:/tmp/t48-sip-test/kamailio.ctl")

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			xlog("L_INFO", "in-dialog $rm $fU -> $tU routed\n");
			t_relay();
			exit;
		}
		if (is_method("ACK")) {
			if (t_check_trans()) t_relay();
			exit;
		}
		if (is_method("SUBSCRIBE")) {
			$du = "sip:127.0.0.1:5075";
			t_relay();
			exit;
		}
		sl_send_reply("404", "Not here");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) t_relay();
		exit;
	}

	t_check_trans();

	# test accounts, each with a made-up test password
	if (is_method("REGISTER")) $var(u) = $tU; else $var(u) = $fU;
	if ($var(u) == "alice") $var(pw) = "test-only-alice";
	else if ($var(u) == "bob") $var(pw) = "test-only-bob";
	# numbered accounts, for sip/test/phone-test.sh (a phone dials digits)
	else if ($var(u) == "1001") $var(pw) = "test-only-1001";
	else if ($var(u) == "1002") $var(pw) = "test-only-1002";
	else if ($var(u) == "1003") $var(pw) = "test-only-1003";
	# the phone's second account (issue #36)
	else if ($var(u) == "1004") $var(pw) = "test-only-1004";
	else $var(pw) = "";

	if (is_method("REGISTER")) {
		if ($var(pw) == "" || !pv_auth_check("$td", "$var(pw)", "0", "1")) {
			xlog("L_INFO", "REGISTER $tU from $si: challenge\n");
			auth_challenge("$td", "0");
			exit;
		}
		consume_credentials();
		if (proto == UDP && nat_uac_test("16")) fix_nated_register();
		if (!save("location")) sl_reply_error();
		xlog("L_INFO", "REGISTER $tU from $si:$sp ($pr): saved\n");
		exit;
	}

#!ifdef UAC_TRUSTED
	if ($fU == "uac") $var(pw) = "trusted";
#!endif
	if (is_method("INVITE|MESSAGE|SUBSCRIBE|OPTIONS") && $var(pw) != "trusted") {
		if ($var(pw) == "" || !pv_auth_check("$fd", "$var(pw)", "0", "0")) {
			proxy_challenge("$fd", "0");
			exit;
		}
		consume_credentials();
	}

	# keepalives (sip/modules/t48keepalive): OPTIONS to the server itself
	if (is_method("OPTIONS") && $rU == $null) {
		xlog("L_INFO", "OPTIONS $fU from $si:$sp ($pr) at $Ts\n");
		sl_send_reply("200", "OK");
		exit;
	}

	# message waiting: every SUBSCRIBE goes to the test's voicemail stand-in
	# (sip/test/mwi.py); with nothing listening there it just times out
	if (is_method("SUBSCRIBE")) {
		$du = "sip:127.0.0.1:5075";
		t_relay();
		exit;
	}

#!ifndef NO_RR
	if (is_method("INVITE")) record_route();
#!endif
#!ifdef WITH_SST
	if (is_method("INVITE")) {
		setflag(6);
		# dialog reads its timeout before sst sets it: give it here. Each
		# request in the call (a refresh) restarts it.
		$avp(dlg_timeout) = 90;
		dlg_manage();
	}
#!endif

#!ifdef UAC_TRUSTED
	if ($rU == "uac") {
		$du = "sip:127.0.0.1:5080";
		xlog("L_INFO", "$rm $fU -> uac relayed\n");
		t_relay();
		exit;
	}
#!endif
	if (!lookup("location")) {
		sl_send_reply("404", "Not Found");
		exit;
	}
	xlog("L_INFO", "$rm $fU -> $tU relayed to $ru\n");
	t_relay();
}
