#!KAMAILIO
# SPDX-License-Identifier: AGPL-3.0-or-later
# Throwaway registrar and proxy for sip/test/call-test.sh: loopback only,
# digest login for REGISTER and INVITE, registrations kept in memory.
# Test passwords only; nothing here is a real credential.

debug=2
log_stderror=yes
memdbg=5
memlog=5
children=2
listen=udp:127.0.0.1:5060
listen=tcp:127.0.0.1:5060
auto_aliases=no

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "auth.so"
loadmodule "ctl.so"

modparam("usrloc", "db_mode", 0)
modparam("ctl", "binrpc", "unix:/tmp/t48-sip-test/kamailio.ctl")

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			t_relay();
			exit;
		}
		if (is_method("ACK")) {
			if (t_check_trans()) t_relay();
			exit;
		}
		if (is_method("SUBSCRIBE")) {
			$du = "sip:127.0.0.1:5075";
			t_relay();
			exit;
		}
		sl_send_reply("404", "Not here");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) t_relay();
		exit;
	}

	t_check_trans();

	# test accounts, each with a made-up test password
	if (is_method("REGISTER")) $var(u) = $tU; else $var(u) = $fU;
	if ($var(u) == "alice") $var(pw) = "test-only-alice";
	else if ($var(u) == "bob") $var(pw) = "test-only-bob";
	# numbered accounts, for sip/test/phone-test.sh (a phone dials digits)
	else if ($var(u) == "1001") $var(pw) = "test-only-1001";
	else if ($var(u) == "1002") $var(pw) = "test-only-1002";
	else if ($var(u) == "1003") $var(pw) = "test-only-1003";
	# the phone's second account (issue #36)
	else if ($var(u) == "1004") $var(pw) = "test-only-1004";
	else $var(pw) = "";

	if (is_method("REGISTER")) {
		if ($var(pw) == "" || !pv_auth_check("$td", "$var(pw)", "0", "1")) {
			xlog("L_INFO", "REGISTER $tU from $si: challenge\n");
			auth_challenge("$td", "0");
			exit;
		}
		consume_credentials();
		if (!save("location")) sl_reply_error();
		xlog("L_INFO", "REGISTER $tU from $si:$sp ($pr): saved\n");
		exit;
	}

	if (is_method("INVITE|MESSAGE|SUBSCRIBE|OPTIONS")) {
		if ($var(pw) == "" || !pv_auth_check("$fd", "$var(pw)", "0", "0")) {
			proxy_challenge("$fd", "0");
			exit;
		}
		consume_credentials();
	}

	# message waiting: every SUBSCRIBE goes to the test's voicemail stand-in
	# (sip/test/mwi.py); with nothing listening there it just times out
	if (is_method("SUBSCRIBE")) {
		$du = "sip:127.0.0.1:5075";
		t_relay();
		exit;
	}

	if (is_method("INVITE")) record_route();

	if (!lookup("location")) {
		sl_send_reply("404", "Not Found");
		exit;
	}
	xlog("L_INFO", "$rm $fU -> $tU relayed to $ru\n");
	t_relay();
}
