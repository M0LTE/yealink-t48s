# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the root filesystem (Buildroot) and the kernel images with that root
# filesystem built in. Linux 6.18 (kernel6/) is the phone's kernel since issue 55:
# Image-kexec, and the live set for a USB stick or TFTP (t48s-live.tar.gz). Linux
# 3.6 (kernel/) is still built from the same root filesystem as a fallback, for
# one release: Image-kexec-linux3.6. Artifacts on pushes to main; a release on a
# v* tag. The SDK
# is built only for tags and runs started by hand (gh workflow run build.yml), and
# each of those also updates the rolling pre-release "sdk-latest" (sdk/README.md).
# No SSH keys go into anything built here, so what it builds starts with SSH off
# (docs/access.md).
# A separate quick job, check, runs the shell's and the web setup page's tests.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # documentation-only changes do not rebuild
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shell's simulator tests and the web setup page's tests: host gcc and
  # python3, a few minutes, and nothing to do with the image build below.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Shell tests (the simulator scripts)
        run: make -C shell check

      - name: Web setup page tests (the handlers, then with the shell)
        run: make -C webconfig check

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BR2_DL_DIR: ${{ github.workspace }}/../br-dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/../br-ccache
      LINUX_SHA256: b0208020e64cb79f05ec40b9d9cf6ff57be3bc459062871f21b4f5fe346ccb32
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc cpio rsync unzip file >/dev/null

      - name: Buildroot downloads cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: br-dl-${{ hashFiles('buildroot/build.sh', 'buildroot/configs/*') }}
          restore-keys: br-dl-

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-

      - name: Root filesystem
        run: buildroot/build.sh "$RUNNER_TEMP/br" all

      - name: SDK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          buildroot/build.sh "$RUNNER_TEMP/br" sdk
          sdk/assemble.sh "$RUNNER_TEMP"/br/output/images/*_sdk-buildroot.tar.gz "$RUNNER_TEMP/t48s-sdk.tar.gz"

      - name: Linux source cache
        uses: actions/cache@v4
        with:
          path: linux-3.6.11.tar.xz
          key: linux-3.6.11

      # The fallback (issue 55): the old kernel with the same first stage and system
      # image. To be dropped, with kernel/, after one release.
      - name: "Fallback kernel, Linux 3.6 (kexec image: first stage and system image built in)"
        run: |
          [ -f linux-3.6.11.tar.xz ] || curl -fsSLO https://cdn.kernel.org/pub/linux/kernel/v3.x/linux-3.6.11.tar.xz
          echo "$LINUX_SHA256  linux-3.6.11.tar.xz" | sha256sum -c -
          docker build -q -t t48s-kbuild:trusty kernel/
          mkdir -p "$RUNNER_TEMP/k"
          tar -C "$RUNNER_TEMP/k" -xf linux-3.6.11.tar.xz
          cp -r kernel "$RUNNER_TEMP/k/"
          cp "$RUNNER_TEMP/br/output/images/firststage.cpio" "$RUNNER_TEMP/br/output/images/system.img" "$RUNNER_TEMP/k/"
          docker run --rm -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/k:/w" -w /w -e ROOTFS=firststage.cpio -e SYSTEM=system.img \
            t48s-kbuild:trusty sh kernel/build.sh kexec

      # The phone's kernel (kernel6/, issues 38 and 55), from the same first stage
      # and system image. Stock Debian compiler in a container; the kernel source
      # is cached, and kernel6/build.sh checks its SHA-256.
      - name: Linux 6.18 source cache
        uses: actions/cache@v4
        with:
          path: k6-src
          key: linux6-${{ hashFiles('kernel6/build.sh') }}

      - name: "Kernel, Linux 6.18 (kexec image, the fit in the 2.5 MB kernel slot, and the live set)"
        run: |
          docker build -q --build-arg QEMU= -t t48s-kbuild6:trixie kernel6/
          mkdir -p "$RUNNER_TEMP/k6" k6-src
          cp k6-src/linux-*.tar.xz "$RUNNER_TEMP/k6/" 2>/dev/null || true
          cp "$RUNNER_TEMP/br/output/images/firststage.cpio" "$RUNNER_TEMP/br/output/images/system.img" "$RUNNER_TEMP/k6/"
          k6() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$RUNNER_TEMP/k6:/w" -e ROOTFS=/w/firststage.cpio "$@" t48s-kbuild6:trixie sh /src/kernel6/build.sh /w; }
          # what would go in the kernel partition: the kernel with the first stage alone
          k6 -e SLOT=1 -e OUT=zImage6-slot
          # what kexec starts: the same with the system image beside the first stage
          k6 -e SYSTEM=/w/system.img -e OUT=Image-kexec
          # what U-Boot's recovery mode starts (docs/live-image.md). The build checks
          # the file's addresses; the generator then makes the set from it
          k6 -e LIVE=1 -e OUT=T48S.bin
          python3 tools/mkliveimage.py build "$RUNNER_TEMP/t48s-live" bin="$RUNNER_TEMP/k6/T48S.bin" system="$RUNNER_TEMP/br/output/images/system.img" kernel=6.18
          ls k6-src/linux-*.tar.xz >/dev/null 2>&1 || cp "$RUNNER_TEMP"/k6/linux-*.tar.xz k6-src/

      - name: Collect outputs
        run: |
          mkdir out
          cp "$RUNNER_TEMP/k6/Image-kexec" "$RUNNER_TEMP/k/Image-kexec-linux3.6" out/
          tar -C "$RUNNER_TEMP" -czf out/t48s-live.tar.gz t48s-live
          cp "$RUNNER_TEMP/br/output/images/rootfs.cpio" "$RUNNER_TEMP/br/output/images/system.img" out/
          if [ -f "$RUNNER_TEMP/t48s-sdk.tar.gz" ]; then cp "$RUNNER_TEMP/t48s-sdk.tar.gz" out/; fi
          gzip -9 out/rootfs.cpio
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: t48s-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: SDK as the rolling pre-release sdk-latest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum t48s-sdk.tar.gz > t48s-sdk.tar.gz.sha256)
          git push -f origin "$GITHUB_SHA:refs/tags/sdk-latest"
          notes="The newest app SDK, rebuilt by hand or for a release. Built from $GITHUB_REF_NAME at $GITHUB_SHA on $(date -u +%Y-%m-%d). How to use it: sdk/README.md."
          if gh release view sdk-latest >/dev/null 2>&1; then
            gh release edit sdk-latest --prerelease --latest=false --title "SDK (latest build)" --notes "$notes"
          else
            gh release create sdk-latest --prerelease --latest=false --verify-tag --title "SDK (latest build)" --notes "$notes"
          fi
          gh release upload sdk-latest out/t48s-sdk.tar.gz out/t48s-sdk.tar.gz.sha256 --clobber
          rm out/t48s-sdk.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" \
            --notes "Image-kexec (Linux 6.18) boots by kexec from Yealink's firmware (tools/ourkernel.sh boot). t48s-live.tar.gz is the same system as the three files for a USB stick or TFTP (docs/live-image.md); it has not been cold-started on a phone yet. Image-kexec-linux3.6 is the same system on the old kernel, kept as a fallback for this release only. Image-kexec carries no SSH keys and no password, and SSH is off until it is turned on at the phone's screen (Settings, Access; docs/access.md). system.img is the system image built into it (docs/boot.md) and rootfs.cpio.gz the same files as an archive; t48s-sdk.tar.gz is the app SDK (sdk/README.md)."
