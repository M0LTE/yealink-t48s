# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the root filesystem (Buildroot) and the kexec kernel image with that root
# filesystem built in. Artifacts on pushes to main; a release on a v* tag. The SDK
# is built only for tags and runs started by hand (gh workflow run build.yml), and
# each of those also updates the rolling pre-release "sdk-latest" (sdk/README.md).
# No SSH keys go into anything built here, so what it builds starts with SSH off
# (docs/access.md).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # documentation-only changes do not rebuild
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BR2_DL_DIR: ${{ github.workspace }}/../br-dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/../br-ccache
      LINUX_SHA256: b0208020e64cb79f05ec40b9d9cf6ff57be3bc459062871f21b4f5fe346ccb32
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc cpio rsync unzip file >/dev/null

      - name: Buildroot downloads cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: br-dl-${{ hashFiles('buildroot/build.sh', 'buildroot/configs/*') }}
          restore-keys: br-dl-

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-

      - name: Root filesystem
        run: buildroot/build.sh "$RUNNER_TEMP/br" all

      - name: SDK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          buildroot/build.sh "$RUNNER_TEMP/br" sdk
          sdk/assemble.sh "$RUNNER_TEMP"/br/output/images/*_sdk-buildroot.tar.gz "$RUNNER_TEMP/t48s-sdk.tar.gz"

      - name: Linux source cache
        uses: actions/cache@v4
        with:
          path: linux-3.6.11.tar.xz
          key: linux-3.6.11

      - name: Kernel (kexec image, Buildroot root filesystem built in)
        run: |
          [ -f linux-3.6.11.tar.xz ] || curl -fsSLO https://cdn.kernel.org/pub/linux/kernel/v3.x/linux-3.6.11.tar.xz
          echo "$LINUX_SHA256  linux-3.6.11.tar.xz" | sha256sum -c -
          docker build -q -t t48s-kbuild:trusty kernel/
          mkdir -p "$RUNNER_TEMP/k"
          tar -C "$RUNNER_TEMP/k" -xf linux-3.6.11.tar.xz
          cp -r kernel "$RUNNER_TEMP/k/"
          cp "$RUNNER_TEMP/br/output/images/rootfs.cpio" "$RUNNER_TEMP/k/"
          docker run --rm -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/k:/w" -w /w -e ROOTFS=rootfs.cpio \
            t48s-kbuild:trusty sh kernel/build.sh kexec

      - name: Collect outputs
        run: |
          mkdir out
          cp "$RUNNER_TEMP/k/Image-kexec" out/
          cp "$RUNNER_TEMP/br/output/images/rootfs.cpio" out/
          if [ -f "$RUNNER_TEMP/t48s-sdk.tar.gz" ]; then cp "$RUNNER_TEMP/t48s-sdk.tar.gz" out/; fi
          gzip -9 out/rootfs.cpio
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: t48s-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: SDK as the rolling pre-release sdk-latest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum t48s-sdk.tar.gz > t48s-sdk.tar.gz.sha256)
          git push -f origin "$GITHUB_SHA:refs/tags/sdk-latest"
          notes="The newest app SDK, rebuilt by hand or for a release. Built from $GITHUB_REF_NAME at $GITHUB_SHA on $(date -u +%Y-%m-%d). How to use it: sdk/README.md."
          if gh release view sdk-latest >/dev/null 2>&1; then
            gh release edit sdk-latest --prerelease --latest=false --title "SDK (latest build)" --notes "$notes"
          else
            gh release create sdk-latest --prerelease --latest=false --verify-tag --title "SDK (latest build)" --notes "$notes"
          fi
          gh release upload sdk-latest out/t48s-sdk.tar.gz out/t48s-sdk.tar.gz.sha256 --clobber
          rm out/t48s-sdk.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" \
            --notes "Image-kexec boots by kexec from Yealink's firmware (tools/ourkernel.sh boot). It carries no SSH keys and no password, and SSH is off until it is turned on at the phone's screen (Settings, Access; docs/access.md). rootfs.cpio.gz is the root filesystem built into it; t48s-sdk.tar.gz is the app SDK (sdk/README.md)."
