# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the root filesystem (Buildroot) and the kernel images with that root
# filesystem built in. Linux 6.18 (kernel6/) is the phone's kernel since issue 55:
# Image-kexec, the live set for TFTP (t48s-live.tar.gz) and the owner's USB stick
# (t48s-stick.zip: the live set and what the on-phone installer writes). Linux
# 3.6 (kernel/) is still built from the same root filesystem as a fallback, for
# one release: Image-kexec-linux3.6. Artifacts on pushes to main; a release on a
# v* tag. The SDK
# is built only for tags and runs started by hand (gh workflow run build.yml), and
# each of those also updates the rolling pre-release "sdk-latest" (sdk/README.md).
# The same runs also make t48s-sources.tar.gz, the source that goes with the
# binaries (NOTICE).
# Every build of main, and every run started by hand, also updates the rolling
# pre-release "system-latest": the system image and the kernel for the kernel
# partition, with VERSION and SHA256SUMS. That is the updater's testing channel;
# its stable channel is the newest v* release (t48-update, docs/install.md).
# No SSH keys go into anything built here, so what it builds starts with SSH off
# (docs/access.md).
# A separate quick job, check, runs the shell's and the web setup page's tests.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # documentation-only changes do not rebuild
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shell's simulator tests and the web setup page's tests: host gcc and
  # python3, a few minutes, and nothing to do with the image build below.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Shell tests (the simulator scripts)
        run: make -C shell check

      - name: Web setup page tests (the handlers, then with the shell)
        run: make -C webconfig check

      - name: Updater tests (check, install and kernel from a channel, on files)
        run: sh tools/test-update.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BR2_DL_DIR: ${{ github.workspace }}/../br-dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/../br-ccache
      LINUX_SHA256: b0208020e64cb79f05ec40b9d9cf6ff57be3bc459062871f21b4f5fe346ccb32
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc cpio rsync unzip file >/dev/null

      - name: Buildroot downloads cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: br-dl-${{ hashFiles('buildroot/build.sh', 'buildroot/configs/*') }}
          restore-keys: br-dl-

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-

      # What the image calls itself (/etc/t48-release, About, the updater): the tag
      # for a release, otherwise the date and the commit
      - name: Version
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) v=$GITHUB_REF_NAME ;;
          *) v=$(date -u +%Y%m%d)-$(echo "$GITHUB_SHA" | cut -c1-7) ;;
          esac
          echo "T48_VERSION=$v" >> "$GITHUB_ENV"
          echo "version: $v"

      - name: Root filesystem
        run: buildroot/build.sh "$RUNNER_TEMP/br" all

      - name: SDK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          buildroot/build.sh "$RUNNER_TEMP/br" sdk
          sdk/assemble.sh "$RUNNER_TEMP"/br/output/images/*_sdk-buildroot.tar.gz "$RUNNER_TEMP/t48s-sdk.tar.gz"

      - name: Linux source cache
        uses: actions/cache@v4
        with:
          path: linux-3.6.11.tar.xz
          key: linux-3.6.11

      # The fallback (issue 55): the old kernel with the same first stage and system
      # image. To be dropped, with kernel/, after one release.
      - name: "Fallback kernel, Linux 3.6 (kexec image: first stage and system image built in)"
        run: |
          [ -f linux-3.6.11.tar.xz ] || curl -fsSLO https://cdn.kernel.org/pub/linux/kernel/v3.x/linux-3.6.11.tar.xz
          echo "$LINUX_SHA256  linux-3.6.11.tar.xz" | sha256sum -c -
          docker build -q -t t48s-kbuild:trusty kernel/
          mkdir -p "$RUNNER_TEMP/k"
          tar -C "$RUNNER_TEMP/k" -xf linux-3.6.11.tar.xz
          cp -r kernel "$RUNNER_TEMP/k/"
          cp "$RUNNER_TEMP/br/output/images/firststage.cpio" "$RUNNER_TEMP/br/output/images/system.img" "$RUNNER_TEMP/k/"
          docker run --rm -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/k:/w" -w /w -e ROOTFS=firststage.cpio -e SYSTEM=system.img \
            t48s-kbuild:trusty sh kernel/build.sh kexec

      # The phone's kernel (kernel6/, issues 38 and 55), from the same first stage
      # and system image. Stock Debian compiler in a container; the kernel source
      # is cached, and kernel6/build.sh checks its SHA-256.
      - name: Linux 6.18 source cache
        uses: actions/cache@v4
        with:
          path: k6-src
          key: linux6-${{ hashFiles('kernel6/build.sh') }}

      - name: "Kernel, Linux 6.18 (kexec image, the fit in the 2.5 MB kernel slot, and the live set)"
        run: |
          docker build -q --build-arg QEMU= -t t48s-kbuild6:trixie kernel6/
          mkdir -p "$RUNNER_TEMP/k6" k6-src
          cp k6-src/linux-*.tar.xz "$RUNNER_TEMP/k6/" 2>/dev/null || true
          cp "$RUNNER_TEMP/br/output/images/firststage.cpio" "$RUNNER_TEMP/br/output/images/system.img" "$RUNNER_TEMP/k6/"
          k6() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$RUNNER_TEMP/k6:/w" -e ROOTFS=/w/firststage.cpio "$@" t48s-kbuild6:trixie sh /src/kernel6/build.sh /w; }
          # what would go in the kernel partition: the kernel with the first stage alone
          k6 -e SLOT=1 -e OUT=zImage6-slot
          # what kexec starts: the same with the system image beside the first stage
          k6 -e SYSTEM=/w/system.img -e OUT=Image-kexec
          # what U-Boot's recovery mode starts (docs/live-image.md). The build checks
          # the file's addresses; the generator then makes the set from it
          k6 -e LIVE=1 -e OUT=T48S.bin
          python3 tools/mkliveimage.py build "$RUNNER_TEMP/t48s-live" bin="$RUNNER_TEMP/k6/T48S.bin" system="$RUNNER_TEMP/br/output/images/system.img" kernel=6.18
          # what the on-phone installer writes into the kernel partition (docs/installer.md);
          # the build checks it as U-Boot's normal start will read it. No keys in it.
          # Also what the updater writes there (t48-update kernel)
          k6 -e FLASH=1 -e OUT=T48S-kernel.uimg
          # the stick: the live set, then install/ with the kernel file and the system image
          python3 tools/mkliveimage.py usb "$RUNNER_TEMP/t48s-stick" bin="$RUNNER_TEMP/k6/T48S.bin" system="$RUNNER_TEMP/br/output/images/system.img" kernel=6.18
          mkdir "$RUNNER_TEMP/t48s-stick/install"
          cp "$RUNNER_TEMP/k6/T48S-kernel.uimg" "$RUNNER_TEMP/br/output/images/system.img" "$RUNNER_TEMP/t48s-stick/install/"
          (cd "$RUNNER_TEMP/t48s-stick/install" && sha256sum T48S-kernel.uimg system.img > SHA256SUMS)
          ls k6-src/linux-*.tar.xz >/dev/null 2>&1 || cp "$RUNNER_TEMP"/k6/linux-*.tar.xz k6-src/

      # The source that goes with the binaries (NOTICE, "Source for the binaries"):
      # Buildroot's legal-info (the source archive, patches, licence text and
      # manifest of every package in the image and in the SDK's toolchain), the
      # Buildroot release itself, both kernel source archives, and this repository
      # (kernel drivers, patches, configurations and device trees). About 470 MB,
      # so only for a release or a run started by hand. Linux 3.6 has no LICENSES
      # folder, which Buildroot's linux-headers package expects: COPYING is named.
      - name: Source archive for a release (t48s-sources.tar.gz)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          buildroot/build.sh "$RUNNER_TEMP/br" legal-info LINUX_HEADERS_LICENSE_FILES=COPYING
          S="$RUNNER_TEMP/t48s-sources"
          mkdir -p "$S/buildroot" "$S/linux"
          mv "$RUNNER_TEMP/br/output/legal-info" "$S/buildroot/legal-info"
          cp "$RUNNER_TEMP"/br/buildroot-*.tar.xz "$S/buildroot/"
          cp "$RUNNER_TEMP"/k6/linux-6.*.tar.xz "$S/linux/"
          # Linux 3.6.11 is already in legal-info while the headers come from it
          [ -n "$(find "$S/buildroot/legal-info" -name linux-3.6.11.tar.xz | head -n 1)" ] || cp linux-3.6.11.tar.xz "$S/linux/"
          git archive --prefix="yealink-t48s-$T48_VERSION/" -o "$S/yealink-t48s-$T48_VERSION.tar.gz" HEAD
          sed "s/@VERSION@/$T48_VERSION/g; s/@COMMIT@/$GITHUB_SHA/g" tools/sources-readme.txt > "$S/README.txt"
          # the archives inside are compressed already
          tar -C "$RUNNER_TEMP" -I 'gzip -1' -cf "$RUNNER_TEMP/t48s-sources.tar.gz" t48s-sources
          rm -rf "$S"
          ls -l "$RUNNER_TEMP/t48s-sources.tar.gz"

      - name: Collect outputs
        run: |
          mkdir out
          cp "$RUNNER_TEMP/k6/Image-kexec" "$RUNNER_TEMP/k/Image-kexec-linux3.6" "$RUNNER_TEMP/k6/T48S-kernel.uimg" out/
          echo "$T48_VERSION" > out/VERSION
          tar -C "$RUNNER_TEMP" -czf out/t48s-live.tar.gz t48s-live
          (cd "$RUNNER_TEMP/t48s-stick" && zip -q -r "$OLDPWD/out/t48s-stick.zip" T48S.rom T48S.bin T48S.rfs README.txt install)
          cp "$RUNNER_TEMP/br/output/images/rootfs.cpio" "$RUNNER_TEMP/br/output/images/system.img" out/
          if [ -f "$RUNNER_TEMP/t48s-sdk.tar.gz" ]; then cp "$RUNNER_TEMP/t48s-sdk.tar.gz" out/; fi
          if [ -f "$RUNNER_TEMP/t48s-sources.tar.gz" ]; then mv "$RUNNER_TEMP/t48s-sources.tar.gz" out/; fi
          gzip -9 out/rootfs.cpio
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: t48s-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: SDK as the rolling pre-release sdk-latest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum t48s-sdk.tar.gz > t48s-sdk.tar.gz.sha256)
          git push -f origin "$GITHUB_SHA:refs/tags/sdk-latest"
          notes="The newest app SDK, rebuilt by hand or for a release. Built from $GITHUB_REF_NAME at $GITHUB_SHA on $(date -u +%Y-%m-%d). How to use it: sdk/README.md. Source for the compiler and libraries inside: NOTICE in the repository."
          if gh release view sdk-latest >/dev/null 2>&1; then
            gh release edit sdk-latest --prerelease --latest=false --title "SDK (latest build)" --notes "$notes"
          else
            gh release create sdk-latest --prerelease --latest=false --verify-tag --title "SDK (latest build)" --notes "$notes"
          fi
          gh release upload sdk-latest out/t48s-sdk.tar.gz out/t48s-sdk.tar.gz.sha256 --clobber
          rm out/t48s-sdk.tar.gz.sha256

      # The updater's testing channel. No SSH keys in either file (docs/access.md).
      - name: System image and kernel as the rolling pre-release system-latest
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir latest
          cp out/VERSION out/system.img out/T48S-kernel.uimg latest/
          (cd latest && sha256sum VERSION system.img T48S-kernel.uimg > SHA256SUMS)
          git push -f origin "$GITHUB_SHA:refs/tags/system-latest"
          notes="The newest build of the system image and the kernel, for testing: $T48_VERSION, built from $GITHUB_REF_NAME at $GITHUB_SHA. An installed phone follows it with: t48-update channel testing (docs/install.md). No SSH keys inside. Source for Linux, busybox and the other third-party parts: NOTICE in the repository."
          if gh release view system-latest >/dev/null 2>&1; then
            gh release edit system-latest --prerelease --latest=false --title "System (latest build, testing)" --notes "$notes"
          else
            gh release create system-latest --prerelease --latest=false --verify-tag --title "System (latest build, testing)" --notes "$notes"
          fi
          # the checksums last: a phone that checks half way through an upload
          # finds files that do not match them yet and refuses
          gh release upload system-latest latest/VERSION latest/system.img latest/T48S-kernel.uimg --clobber
          gh release upload system-latest latest/SHA256SUMS --clobber

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" \
            --notes "t48s-stick.zip is what a phone owner needs: unpack it onto a FAT32 USB stick, start the phone from it, and install from the phone's own screen if you want to keep it (docs/guide.md). Use a 5 V power supply of 1.5 A or more. It holds no keys and no password; SSH is off until it is turned on at the phone's screen (Settings, Access). The rest is for developers and for the updater: t48s-live.tar.gz is the same three start files for a TFTP server (docs/live-image.md); system.img and T48S-kernel.uimg are what an installed phone on the stable channel updates itself from (docs/install.md); rootfs.cpio.gz is the system image's files as an archive; Image-kexec (Linux 6.18) and Image-kexec-linux3.6 (the old kernel, kept as a fallback for this release only) start by kexec from Yealink's firmware; t48s-sdk.tar.gz is the app SDK (sdk/README.md). t48s-sources.tar.gz is the source that goes with these binaries: Linux, busybox and the other third-party packages, with their licences (NOTICE). Not affiliated with or endorsed by Yealink. Use at your own risk."
